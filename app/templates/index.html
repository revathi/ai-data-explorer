<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure NL Analytics — Demo</title>
<style>
  body { font-family: -apple-system, Segoe UI, sans-serif; max-width: 900px; margin: 40px auto; background: #f7f7f9; color: #222; }
  h1 { font-size: 22px; }
  .panel { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
  select, input[type=text] { padding: 8px; font-size: 14px; border-radius: 6px; border: 1px solid #ccc; }
  input[type=text] { width: 60%; }
  button { padding: 8px 16px; font-size: 14px; border-radius: 6px; border: none; background: #4f46e5; color: white; cursor: pointer; }
  button:hover { background: #4338ca; }
  pre { background: #1e1e2e; color: #cdd6f4; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 13px; }
  table { border-collapse: collapse; width: 100%; margin-top: 10px; }
  th, td { border: 1px solid #ddd; padding: 6px 10px; text-align: left; font-size: 13px; }
  th { background: #f0f0f5; }
  .blocked { background: #fee2e2; border: 1px solid #ef4444; color: #991b1b; padding: 12px; border-radius: 6px; }
  .label { font-weight: 600; font-size: 12px; text-transform: uppercase; color: #666; margin-bottom: 4px; }
  #loading { display:none; color:#666; font-size: 13px; }
</style>
</head>
<body>
  <h1>🔒 Secure NL Analytics — Demo</h1>
  <div class="panel">
    <div class="label">Logged in as</div>
    <select id="userSelect">
      {% for u in users %}
      <option value="{{ u }}">{{ u }}</option>
      {% endfor %}
    </select>
    <br><br>
    <div class="label">Ask a business question</div>
    <input type="text" id="question" placeholder="e.g. What were total sales by product last quarter?">
    <button onclick="ask()">Ask</button>
    <div id="loading">Thinking…</div>
  </div>

  <div id="results"></div>

  <script>
    async function ask() {
      const question = document.getElementById('question').value;
      const user = document.getElementById('userSelect').value;
      const loading = document.getElementById('loading');
      const results = document.getElementById('results');
      results.innerHTML = '';
      loading.style.display = 'block';

      try {
        const res = await fetch('/ask', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({question, user})
        });
        const data = await res.json();
        loading.style.display = 'none';

        let html = '<div class="panel">';
        html += `<div class="label">Generated SQL (raw, from LLM)</div><pre>${escapeHtml(data.log?.generated_sql || '')}</pre>`;

        if (data.blocked) {
          html += `<div class="blocked"><strong>Blocked by governance layer:</strong> ${escapeHtml(data.reason)}</div>`;
        } else if (data.error) {
          html += `<div class="blocked"><strong>Error:</strong> ${escapeHtml(data.error)}</div>`;
        } else {
          html += `<div class="label">Secured SQL (after governance enforcement)</div><pre>${escapeHtml(data.log.secured_sql)}</pre>`;
          html += renderTable(data.columns, data.rows);
        }
        html += '</div>';
        results.innerHTML = html;
      } catch (e) {
        loading.style.display = 'none';
        results.innerHTML = `<div class="blocked">Request failed: ${e}</div>`;
      }
    }

    function renderTable(columns, rows) {
      if (!rows || rows.length === 0) return '<p>No rows returned.</p>';
      let html = '<table><thead><tr>';
      columns.forEach(c => html += `<th>${escapeHtml(c)}</th>`);
      html += '</tr></thead><tbody>';
      rows.forEach(r => {
        html += '<tr>' + r.map(v => `<td>${escapeHtml(String(v))}</td>`).join('') + '</tr>';
      });
      html += '</tbody></table>';
      return html;
    }

    function escapeHtml(s) {
      const div = document.createElement('div');
      div.innerText = s;
      return div.innerHTML;
    }

    document.getElementById('question').addEventListener('keydown', e => {
      if (e.key === 'Enter') ask();
    });
  </script>
</body>
</html>
