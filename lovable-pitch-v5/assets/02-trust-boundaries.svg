<text x="90" y="352" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#F5F7FF">Generate SQL</text>
<text x="90" y="393" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#C2CBE2">Use approved schema and definitions</text>
<text x="90" y="476" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#F5F7FF">Combine permitted data</text>
<text x="90" y="517" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#C2CBE2">Filter, join, sort and aggregate</text>
<text x="90" y="600" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#F5F7FF">Explain results</text>
<text x="90" y="641" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#C2CBE2">Summarise authorised query results</text>
<text x="90" y="724" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#F5F7FF">Continue the conversation</text>
<text x="90" y="765" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#C2CBE2">Clarify and refine business questions</text>
<rect x="680" y="190" width="560" height="680" rx="16" fill="#171F43" stroke="#FF8C9A" stroke-width="2"/>
<ellipse cx="728.0" cy="243.0" rx="20.0" ry="20.0" fill="none" stroke="#FF8C9A" stroke-width="3"/>
<polyline points="720,235 736,251" fill="none" stroke="#FF8C9A" stroke-width="3"/>
<polyline points="720,251 736,235" fill="none" stroke="#FF8C9A" stroke-width="3"/>
<text x="768" y="247" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" fill="#FF8C9A">Execution restrictions</text>
<polyline points="708,285 1210,285" fill="none" stroke="#FF8C9A" stroke-width="3"/>
<text x="710" y="352" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#F5F7FF">No database changes</text>
<text x="710" y="393" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#C2CBE2">Restricted read-only database account</text>
<text x="710" y="476" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#F5F7FF">No unauthorised data access</text>
<text x="710" y="517" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#C2CBE2">Approved tables, columns and rows</text>
<text x="710" y="600" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#F5F7FF">No unchecked execution</text>
<text x="710" y="641" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#C2CBE2">Validation and required approval</text>
<text x="710" y="724" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#F5F7FF">No unbounded queries</text>
<text x="710" y="765" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#C2CBE2">Configured result limits and timeouts</text>
<rect x="1300" y="190" width="560" height="680" rx="16" fill="#171F43" stroke="#71C9FF" stroke-width="2"/>
