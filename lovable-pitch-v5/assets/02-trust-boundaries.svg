<text x="1330" y="352" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#F5F7FF">Verified identity and role</text>
<text x="1330" y="393" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#C2CBE2">Company IAM + data access policies</text>
<text x="1330" y="476" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#F5F7FF">SQL syntax and policy checks</text>
<text x="1330" y="517" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#C2CBE2">Validation enforced in application code</text>
<text x="1330" y="600" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#F5F7FF">Human review and approval</text>
<text x="1330" y="641" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#C2CBE2">Exact SQL approved; access rechecked</text>
<text x="1330" y="724" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700" fill="#F5F7FF">Traceability</text>
<text x="1330" y="765" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#C2CBE2">Recorded decisions and executions</text>
<rect x="60" y="925" width="1800" height="95" rx="16" fill="#171F43" stroke="#FF7900" stroke-width="2"/>
<text x="90" y="975" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" fill="#F5F7FF">Model instructions guide generation. Application and database controls enforce the boundaries.</text>
